name: Keep scheduled refresh enabled

# GitHub can suspend scheduled workflows in public repos after 60 days of inactivity.
# A monthly commit keeps this otherwise unchanged weather site active.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 1 * *'

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh maintenance timestamp
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-activity.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-activity.txt
          git commit -m 'chore: keep scheduled data refresh active [skip ci]' || exit 0
          git push
